name: Surgipelago drip

# Grows the wiki on a schedule: generate.py asks Claude (Haiku, on the Max
# subscription via CLAUDE_CODE_OAUTH_TOKEN) to fill the most-wanted red links,
# rebuilds docs/, and pushes — which redeploys GitHub Pages automatically.

on:
  schedule:
    - cron: '0 16 * * *'        # daily ~16:00 UTC (~02:00 AEST). Edit to taste.
  workflow_dispatch:
    inputs:
      count:
        description: 'Articles to generate this run'
        default: '20'
      batch:
        description: 'Articles per Claude call'
        default: '4'
      focus:
        description: 'Optional: comma-sep strand keys to all-invent in (e.g. theses,fan-theories,lost-media)'
        default: ''
      directive:
        description: 'Optional: a custom generation directive to steer the batch'
        default: ''

concurrency:
  group: surgipelago-drip       # never two drips at once
  cancel-in-progress: false

permissions:
  contents: write               # to push the new articles back

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the Max token is configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Run 'claude setup-token' locally and add it as a repo secret."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code

      - name: Grow the archive
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IN_COUNT: ${{ github.event.inputs.count || '20' }}
          IN_BATCH: ${{ github.event.inputs.batch || '4' }}
          IN_FOCUS: ${{ github.event.inputs.focus }}
          IN_DIRECTIVE: ${{ github.event.inputs.directive }}
        run: |
          args=(--count "$IN_COUNT" --batch "$IN_BATCH" --model haiku)
          [ -n "$IN_FOCUS" ] && args+=(--focus "$IN_FOCUS")
          [ -n "$IN_DIRECTIVE" ] && args+=(--directive "$IN_DIRECTIVE")
          echo "running: generate.py ${args[*]:0:5} ..."
          python3 engine/generate.py "${args[@]}"

      - name: Commit & push if anything grew
        run: |
          git config user.name "surgipelago-drip[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new articles this run."; exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- content | grep -c '\.md$' || true)
          git commit -m "drip: grow the archive ($(date -u +%Y-%m-%d) · +${added} new articles)"
          # robust push: on rejection, re-apply OUR new content/*.md onto the latest main
          # and rebuild docs from scratch. Articles have unique names so they never collide;
          # derived files (docs/, data/) are regenerated, so content can never be silently lost.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed ${added} new article(s); Pages will redeploy."; exit 0
            fi
            echo "Push rejected (attempt ${attempt}); re-applying content onto latest main..."
            tmp=$(mktemp -d)
            git archive HEAD content | tar -x -C "$tmp"
            git fetch origin main
            git reset --hard origin/main
            cp -a "$tmp"/content/. content/
            rm -rf "$tmp"
            python3 engine/build.py
            git add -A
            if git diff --cached --quiet; then echo "Nothing new after merge."; exit 0; fi
            added=$(git diff --cached --name-only --diff-filter=A -- content | grep -c '\.md$' || true)
            git commit -m "drip: grow the archive ($(date -u +%Y-%m-%d) · +${added} new articles)"
          done
          echo "::error::Push still failing after 5 attempts."; exit 1
